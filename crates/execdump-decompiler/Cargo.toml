[package]
name = "execdump-decompiler"
description = "Function recovery, call graph and decompilation to C"
version.workspace = true
edition.workspace = true

[dependencies]
execdump-core.workspace = true
capstone.workspace = true
inkwell.workspace = true
lang-c.workspace = true
llm = { version = "1.3.8", default-features = false, features = ["openai", "anthropic", "ollama", "google", "deepseek", "mistral", "groq", "xai", "openrouter", "rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
