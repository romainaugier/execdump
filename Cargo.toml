[workspace]
members = ["crates/execdump-core", "crates/execdump-debugger", "crates/execdump-decompiler", "crates/execdump-project", "crates/execdump-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
execdump-core = { path = "crates/execdump-core" }
execdump-debugger = { path = "crates/execdump-debugger" }
execdump-decompiler = { path = "crates/execdump-decompiler" }
execdump-project = { path = "crates/execdump-project" }
execdump-tui = { path = "crates/execdump-tui" }
anyhow = "1.0"
capstone = "0.14.0"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
inkwell = { version = "0.10.0", default-features = false, features = ["llvm18-1-force-static", "target-x86", "target-aarch64"] }
lang-c = "0.15.1"
ratatui = "0.30.0"
regex = "1.12.2"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
strum = "0.27.2"
strum_macros = "0.27.2"
toml = "0.9.10"

[package]
name = "execdump"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
execdump-core.workspace = true
execdump-decompiler.workspace = true
execdump-project.workspace = true
execdump-tui.workspace = true
clap.workspace = true
dirs.workspace = true
regex.workspace = true
serde.workspace = true
toml.workspace = true

# mimalloc replaces malloc for the whole process (LLVM included), the static override is only reliable on Linux
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["override"] }
