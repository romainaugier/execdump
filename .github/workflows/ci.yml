name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            llvm: windows-x86_64
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            llvm: windows-arm64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      # Keep test fixtures byte-identical on Windows.
      - name: Disable line ending conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev libzstd-dev zlib1g-dev libxml2-dev gdb lldb
          echo "LLVM_SYS_181_PREFIX=/usr/lib/llvm-18" >> "$GITHUB_ENV"

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@18 zstd
          echo "LLVM_SYS_181_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      # No prebuilt package is linkable on Windows (missing AArch64 target, x64 only, or libxml2s.lib required)
      - name: Install LLVM 18 (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/llvm-windows
        with:
          target: ${{ matrix.llvm }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}
