name: Bug report
description: A crash, a wrong output or a TUI problem (for wrong decompiled code, use the Decompilation template)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Check that it still happens on `dev`. A crafted binary that crashes or hangs execdump may be a security issue, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what you got. Paste the error or the panic message.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact command line, or the TUI keys and commands.
      render: shell
    validations:
      required: true
  - type: textarea
    id: binary
    attributes:
      label: Binary
      description: Attach it (zipped) or link it, or say how to build it. Give its format and architecture if you cannot share it.
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Specs
      description: The output of `execdump --specs` (build, machine and platform).
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: The relevant part of ~/.execdumprc, the LLM backend for LLM issues, a screenshot for TUI issues.
