[workspace]
members = ["crates/daedale-core", "crates/daedale-debugger", "crates/daedale-decompiler", "crates/daedale-project", "crates/daedale-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/romainaugier/daedale"

[workspace.dependencies]
daedale-core = { path = "crates/daedale-core" }
daedale-debugger = { path = "crates/daedale-debugger" }
daedale-decompiler = { path = "crates/daedale-decompiler" }
daedale-project = { path = "crates/daedale-project" }
daedale-tui = { path = "crates/daedale-tui" }
anyhow = "1.0"
arboard = { version = "3.7.0", default-features = false }
capstone = "0.14.0"
chrono = "0.4.42"
clap = { version = "4.5.54", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
inkwell = { version = "0.10.0", default-features = false, features = ["llvm18-1-force-static", "target-x86", "target-aarch64"] }
lang-c = "0.15.1"
ratatui = "0.30.0"
regex = "1.12.2"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
strum = "0.27.2"
strum_macros = "0.27.2"
toml = "0.9.10"

[package]
name = "daedale"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
daedale-core.workspace = true
daedale-debugger.workspace = true
daedale-decompiler.workspace = true
daedale-project.workspace = true
daedale-tui.workspace = true
capstone.workspace = true
clap.workspace = true
crossterm.workspace = true
inkwell.workspace = true
dirs.workspace = true
regex.workspace = true
serde.workspace = true
toml.workspace = true

# mimalloc replaces malloc for the whole process (LLVM included), the static override is only reliable on Linux
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, features = ["override"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
